<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서서연구소 단기 육아휴직 예상급여 계산기 V3</title>
<style>
*{box-sizing:border-box}
:root{--ink:#172033;--muted:#7b8491;--line:#dce2ea;--soft:#f7f9fc;--accent:#2563eb;--accent2:#1d4ed8}
body{margin:0;padding:14px;background:#eef2f6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
.calc-shell{max-width:540px;margin:0 auto;background:#fff;border:3px solid #1f2937;border-radius:22px;box-shadow:0 14px 32px rgba(15,23,42,.16);overflow:visible}
.calc-head{background:linear-gradient(135deg,#1f2937,#334155);color:#fff;padding:15px 17px 13px}
.brand{font-size:11px;font-weight:800;letter-spacing:.02em;opacity:.78;margin-bottom:5px}
.calc-head h1{margin:0;font-size:19px;line-height:1.32}.calc-head p{margin:4px 0 0;font-size:12px;opacity:.84;line-height:1.45}
.calc-body{padding:14px 15px 15px}
.step{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #edf0f4}
.step:last-of-type{border-bottom:0}.step-label{font-size:13px;font-weight:850}.num{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;background:#eef2ff;color:#3149a8;font-size:12px;margin-right:5px}
.money-wrap{position:relative}.control,.date-trigger{width:100%;height:39px;border:1px solid #cfd6df;border-radius:10px;background:#fff;padding:0 38px 0 11px;font-size:14px;color:#273043;outline:none}.control::placeholder{color:#b2b7c0}.control:focus,.date-trigger:focus{border-color:#8291a5;box-shadow:0 0 0 3px rgba(58,76,100,.08)}
.won{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:#737b86;font-weight:750}.date-trigger{text-align:left;cursor:pointer;position:relative}.date-trigger:after{content:"📅";position:absolute;right:10px;top:8px;font-size:15px}.date-trigger.placeholder{color:#aeb4bd}.date-trigger.selected{color:#1f2937;font-weight:750}
.calendar-pop{display:none;margin:8px 0 3px;padding:10px;border:1px solid #d9dfe8;border-radius:12px;background:#fff;box-shadow:0 8px 22px rgba(15,23,42,.09)}.calendar-pop.open{display:block}.cal-head{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:6px;margin-bottom:7px}.nav{height:31px;border:0;border-radius:8px;background:#f1f4f8;font-size:19px;cursor:pointer}.ym{text-align:center;font-size:13px;font-weight:850}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.week div{text-align:center;color:#8b94a1;font-size:10px;padding:4px 0}.day{height:30px;border:0;background:#fff;border-radius:8px;font-size:12px;cursor:pointer}.day:hover{background:#f1f5f9}.day.selected{background:#1f2937;color:#fff;font-weight:900}.day.muted{visibility:hidden}
.periods{display:grid;grid-template-columns:1fr 1fr;gap:7px}.period{height:39px;border:1px solid #cfd6df;border-radius:11px;background:linear-gradient(#fff,#f6f8fb);font-size:13px;font-weight:850;color:#475569;cursor:pointer;box-shadow:0 2px 0 #d7dde5}.period.active{background:linear-gradient(#2f6feb,#1d4ed8);color:#fff;border-color:#1d4ed8;box-shadow:0 3px 0 #173d9c,0 5px 12px rgba(37,99,235,.18);transform:translateY(-1px)}
.range{margin:10px 0 9px;padding:8px 10px;border-radius:10px;background:#f8fafc;border:1px dashed #d8dee8;font-size:12px;color:#596273;min-height:34px;display:flex;align-items:center}
.calc-btn{width:100%;height:45px;border:0;border-radius:12px;background:#111827;color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #000,0 8px 15px rgba(15,23,42,.13)}.calc-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
.result-slot{min-height:88px;height:auto;margin-top:11px;border-radius:13px;border:1px solid #e1e6ed;background:#f8fafc;padding:10px 12px;display:flex;align-items:center;justify-content:center;text-align:center;color:#969eaa;font-size:12px}.result-slot.has{display:block;text-align:left;color:#1f2937;background:#f7fbff;border-color:#cfe0f6}.result-top{display:flex;align-items:end;justify-content:space-between;gap:10px}.result-title{font-size:11px;color:#697386;font-weight:700}.money{font-size:25px;font-weight:950;letter-spacing:-.02em;margin-top:2px}.period-txt{font-size:11px;color:#687386;text-align:right;line-height:1.4}.detail-btn{margin-top:7px;border:0;background:transparent;padding:0;color:#446180;font-size:11px;font-weight:800;cursor:pointer}.detail-wrap{
  position:static;
}

.detail{
  display:none;
  margin-top:10px;
  padding:10px 12px;
  background:#fff;
  border:1px solid #e4e8ee;
  border-radius:10px;
  font-size:11px;
  line-height:1.65;
  color:#56606f;
}

.detail.open{
  display:block;
  position:static;
  width:100%;
  box-shadow:none;
}

.result-slot{
  min-height:88px;
  height:auto;
}
.mini-note{margin-top:9px;font-size:10.5px;line-height:1.45;color:#8a929d;text-align:center}
@media(max-width:440px){body{padding:8px}.calc-shell{border-width:2px;border-radius:18px}.calc-head{padding:13px 14px 11px}.calc-head h1{font-size:18px}.calc-body{padding:11px 12px 13px}.step{grid-template-columns:106px 1fr;gap:8px;padding:8px 0}.step-label{font-size:12px}.control,.date-trigger,.period{height:38px}.result-slot{height:84px}}
</style>
</head>
<body>
<div class="calc-shell">
  <div class="calc-head">
    <div class="brand">서서연구소 계산기 #001</div>
    <h1>단기 육아휴직 예상급여 계산기</h1>
    <p>3가지만 입력하면 1주·2주 예상급여를 바로 확인할 수 있습니다.</p>
  </div>
  <div class="calc-body">
    <div class="step">
      <div class="step-label"><span class="num">1</span>월 통상임금</div>
      <div class="money-wrap"><input id="wageDisplay" class="control" type="text" inputmode="numeric" placeholder="금액 입력" autocomplete="off"><span class="won">원</span></div>
    </div>
    <div class="step">
      <div class="step-label"><span class="num">2</span>휴직 시작일</div>
      <div>
        <button id="dateTrigger" class="date-trigger placeholder" type="button" onclick="toggleCalendar()">날짜 선택</button>
        <div id="calendarPop" class="calendar-pop">
          <div class="cal-head"><button class="nav" type="button" onclick="moveMonth(-1)">‹</button><div id="ymText" class="ym"></div><button class="nav" type="button" onclick="moveMonth(1)">›</button></div>
          <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
          <div class="days" id="days"></div>
        </div>
      </div>
    </div>
    <div class="step">
      <div class="step-label"><span class="num">3</span>사용기간</div>
      <div class="periods"><button id="p7" class="period active" type="button" onclick="setPeriod(7)">1주 · 7일</button><button id="p14" class="period" type="button" onclick="setPeriod(14)">2주 · 14일</button></div>
    </div>
    <div id="dateSummary" class="range">휴직 시작일을 선택해주세요.</div>
    <button class="calc-btn" type="button" onclick="calculate()">예상급여 계산하기</button>
    <div class="detail-wrap">
      <div id="result" class="result-slot">계산 결과가 여기에 표시됩니다.</div>
      <div id="detail" class="detail"></div>
    </div>
    <div class="mini-note">일반 육아휴직 1~3개월차 · 월 상한 250만원 기준 · 예상액 확인용</div>
  </div>
</div>
<script>
let selected=null;
const today=new Date();
let viewY=Math.max(2026,today.getFullYear()), viewM=today.getMonth(), period=7;
const CAP=2500000;
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function trunc10(n){return Math.floor((n+1e-7)/10)*10}
function numberOnly(s){return Number(String(s).replace(/[^\d]/g,''))||0}
function comma(n){return n.toLocaleString('ko-KR')}
const wageInput=document.getElementById('wageDisplay');
wageInput.addEventListener('input',function(){const n=numberOnly(this.value);this.value=n?comma(n):''});
function toggleCalendar(){document.getElementById('calendarPop').classList.toggle('open');renderCal()}
function moveMonth(n){viewM+=n;if(viewM<0){viewM=11;viewY--}if(viewM>11){viewM=0;viewY++}viewY=Math.max(2026,Math.min(2035,viewY));renderCal()}
function renderCal(){document.getElementById('ymText').textContent=`${viewY}년 ${viewM+1}월`;const box=document.getElementById('days');box.innerHTML='';const first=new Date(viewY,viewM,1,12),startDow=first.getDay(),dim=daysInMonth(viewY,viewM);for(let i=0;i<startDow;i++){let b=document.createElement('button');b.className='day muted';b.disabled=true;box.appendChild(b)}for(let d=1;d<=dim;d++){let b=document.createElement('button');b.className='day';b.textContent=d;if(selected&&selected.getFullYear()===viewY&&selected.getMonth()===viewM&&selected.getDate()===d)b.classList.add('selected');b.onclick=()=>{selected=new Date(viewY,viewM,d,12);document.getElementById('dateTrigger').textContent=fmt(selected);document.getElementById('dateTrigger').classList.remove('placeholder');document.getElementById('dateTrigger').classList.add('selected');document.getElementById('calendarPop').classList.remove('open');updateSummary()};box.appendChild(b)}}
function setPeriod(n){period=n;document.getElementById('p7').classList.toggle('active',n===7);document.getElementById('p14').classList.toggle('active',n===14);updateSummary()}
function updateSummary(){const s=document.getElementById('dateSummary');if(!selected){s.textContent='휴직 시작일을 선택해주세요.';return}const end=addDays(selected,period-1);s.textContent=`휴직기간 ${fmt(selected)} ~ ${fmt(end)} · 총 ${period}일`}
function calculate(){const wage=numberOnly(wageInput.value);if(!wage){alert('월 통상임금을 입력해주세요.');wageInput.focus();return}if(!selected){alert('휴직 시작일을 선택해주세요.');return}const divisor=daysInMonth(selected.getFullYear(),selected.getMonth());const base=Math.min(wage,CAP);const raw=base*period/divisor;const pay=trunc10(raw);const end=addDays(selected,period-1);const r=document.getElementById('result');r.className='result-slot has';r.innerHTML=`<div class="result-top"><div><div class="result-title">예상 육아휴직급여</div><div class="money">${comma(pay)}원</div></div><div class="period-txt">${fmt(selected)}<br>~ ${fmt(end)} · ${period}일</div></div><button class="detail-btn" type="button" onclick="toggleDetail()">계산 과정 자세히 보기 ▾</button>`;document.getElementById('detail').innerHTML=`통상임금: ${comma(wage)}원<br>적용 월 기준액: ${comma(base)}원${wage>CAP?' (월 상한 250만원 적용)':''}<br>시작월 일수: ${divisor}일<br><b>계산:</b> ${comma(base)} × ${period} ÷ ${divisor} = ${raw.toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1})}원<br>10원 미만 절사 → <b>${comma(pay)}원</b>`}
function toggleDetail(){document.getElementById('detail').classList.toggle('open')}
renderCal();updateSummary();
</script>
</body>
</html>
